version: '3.8'

services:
  babatassoft-vault:
    build: .
    container_name: babatassoft-quantum-vault
    ports:
      - "5000:5000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # NVIDIA Ekran Kartını (GPU) Docker içine aktarma komutu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped